[test-groups]
heavy-e2e = { max-threads = 2 }

# The topology tests spawn in-process `redis-server` fixtures through a racy
# TOCTOU port allocator (redis-test), and the sentinel is never readiness-gated;
# serialize them so concurrent fixtures cannot collide on a port.
redis-fixtures = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(e2e_grants) | binary(e2e_abuse)'
test-group = 'heavy-e2e'

[[profile.default.overrides]]
filter = 'binary(topology)'
test-group = 'redis-fixtures'
